# chromaswap - loads the Klipper-version detector and adds a test macro.
[chromaswap_klipper]

[gcode_macro CHROMASWAP_INFO]
description: Show the detected Klipper series and the chromaswap profile in use
gcode:
    {% set c = printer.chromaswap_klipper %}
    RESPOND MSG="chromaswap: Klipper {c.version} (series {c.series}), profile {c.profile_series}, known {c.known}"
